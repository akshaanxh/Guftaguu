# ─── Spring HTTP Server (REST: GET /, POST /api/report) ──────────────────────
server.port=3002

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# ─── Discord ──────────────────────────────────────────────────────────────────
app.discord.webhook-url=${DISCORD_WEBHOOK_URL:}

# ─── Socket.IO — WebSocket server ────────────────────────────────────────────
socketio.host=0.0.0.0
socketio.port=3001
socketio.allowed-origins=http://localhost:5173,https://guftaguu.vercel.app
socketio.ping-timeout=60000
socketio.ping-interval=10000

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.guftaguu=INFO
logging.level.com.corundumstudio=WARN
